<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .particle { animation: pulseParticle 4s infinite ease-in-out; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 1.3s; }
    .p3 { animation-delay: 2.6s; }

    .animated-wave {
      stroke-dasharray: 10 15;
      animation: flowLine 15s linear infinite;
    }
    .pill1 { animation: floatPill 6s infinite ease-in-out; }
    .pill2 { animation: floatPill 6s infinite ease-in-out 3s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Background Animated Network Connections (placed in back to avoid obscuring text) -->
  <g stroke="#818cf8" stroke-opacity="0.25" stroke-width="2" fill="none" class="animated-wave">
    <path d="M -50 250 C 300 320, 400 100, 700 240 C 950 350, 1100 120, 1250 180" />
    <path d="M -50 80 C 200 10, 500 220, 850 60 C 1050 -20, 1150 200, 1250 260" />
  </g>

  <!-- Animated Ambient Glowing Orbs -->
  <circle cx="150" cy="240" r="4" fill="#38bdf8" class="particle p1" filter="url(#glow)" />
  <circle cx="950" cy="80" r="5" fill="#c084fc" class="particle p2" filter="url(#glow)" />
  <circle cx="1080" cy="230" r="4" fill="#818cf8" class="particle p3" filter="url(#glow)" />

  <!-- Floating Feature Pills (Placed at top right to keep center foreground clear) -->
  <g class="pill1" transform="translate(860, 40)">
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="34" y="21" class="badge-text">FHIR R4 / R5</text>
  </g>

  <g class="pill2" transform="translate(1015, 40)">
    <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#c084fc" />
    <text x="34" y="21" class="badge-text">Closed-Loop</text>
  </g>

  <!-- Main Header Content (Foreground) -->
  <g transform="translate(80, 125)">
    <!-- Icon Symbol -->
    <g transform="translate(0, -42)">
      <rect width="54" height="54" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <path d="M 27 15 L 27 39 M 15 27 L 39 27" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <circle cx="27" cy="27" r="18" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="4 4" />
    </g>

    <!-- Main Title -->
    <text x="74" y="0" class="title">Awesome Care Coordination Platform</text>
    
    <!-- Subtitle -->
    <text x="74" y="38" class="subtitle">Curated Ecosystem of Enterprise SaaS &amp; Open-Source Healthcare Platforms</text>
    
    <!-- Sub-subtitle tags -->
    <g transform="translate(74, 60)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" font-weight="500">
        Population Health • Social Care Referrals • Closed-Loop Communication • SMART-on-FHIR
      </text>
    </g>
  </g>
</svg>
